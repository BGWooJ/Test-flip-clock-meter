<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Taxi Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .rate-input {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            font-size: 24px;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            width: 250px;
            margin-bottom: 20px;
        }

        .rate-input:focus {
            outline: none;
            border-color: #666;
        }

        .start-btn {
            background: #fff;
            color: #000;
            border: none;
            font-size: 20px;
            padding: 15px 50px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .start-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: scale(1);
        }

        .display-section {
            margin: 60px 0;
        }

        .dollar-sign {
            font-size: 80px;
            font-weight: bold;
            display: inline-block;
            vertical-align: top;
            margin-right: 10px;
            margin-top: 20px;
        }

        .flip-container {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .digit-wrapper {
            display: inline-block;
            position: relative;
        }

        .flip-card {
            position: relative;
            width: 80px;
            height: 120px;
            perspective: 600px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 50%;
            background: #1a1a1a;
            border: 2px solid #333;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .card-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
            align-items: flex-start;
        }

        .card-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            border-top: 1px solid #000;
            align-items: flex-end;
        }

        .card-face span {
            font-size: 80px;
            font-weight: bold;
            line-height: 1;
            color: #fff;
        }

        .card-top span {
            transform: translateY(0);
        }

        .card-bottom span {
            transform: translateY(-50%);
        }

        .flip-card-back-top,
        .flip-card-back-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            background: #1a1a1a;
            border: 2px solid #333;
            overflow: hidden;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
        }

        .flip-card-back-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
            transform-origin: bottom;
            align-items: flex-start;
        }

        .flip-card-back-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            border-top: 1px solid #000;
            transform-origin: top;
            align-items: flex-end;
        }

        .flip-card-back-top span {
            font-size: 80px;
            font-weight: bold;
            line-height: 1;
            color: #fff;
            transform: translateY(0);
        }

        .flip-card-back-bottom span {
            font-size: 80px;
            font-weight: bold;
            line-height: 1;
            color: #fff;
            transform: translateY(-50%);
        }

        .flip-card.flipping .flip-card-back-top {
            animation: flipTop 0.4s ease-in;
            z-index: 2;
        }

        .flip-card.flipping .flip-card-back-bottom {
            animation: flipBottom 0.4s ease-out 0.4s;
            z-index: 1;
        }

        @keyframes flipTop {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-90deg);
            }
        }

        @keyframes flipBottom {
            0% {
                transform: rotateX(90deg);
            }
            100% {
                transform: rotateX(0deg);
            }
        }

        .flip-card.wobble .card-face {
            animation: wobble 0.4s ease-in-out;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            75% { transform: rotate(-1deg); }
        }

        .separator {
            font-size: 80px;
            font-weight: bold;
            margin: 0 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            align-items: center;
        }

        .control-btn {
            background: transparent;
            border: 2px solid #333;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: #666;
            background: #1a1a1a;
        }

        .elapsed-time {
            color: #666;
            font-size: 18px;
            font-weight: normal;
        }

        .per-hour {
            color: #666;
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <input type="number" class="rate-input" id="rateInput" placeholder="150.00" step="0.01" min="0">
            <div style="color: #666; margin-bottom: 20px;">$ per hour</div>
            <button class="start-btn" id="startBtn">Start</button>
        </div>

        <div class="display-section">
            <span class="dollar-sign">$</span>
            <div class="flip-container" id="flipContainer"></div>
            <div class="per-hour" id="rateDisplay"></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="resetBtn" title="Reset">↻</button>
            <div class="elapsed-time" id="elapsedTime">00:00:00</div>
            <button class="control-btn" id="soundBtn" title="Toggle Sound">🔊</button>
        </div>
    </div>

    <script>
        let hourlyRate = 0;
        let isRunning = false;
        let startTime = 0;
        let elapsedSeconds = 0;
        let intervalId = null;
        let soundEnabled = true;
        let currentDisplayValue = '00.00';

        const rateInput = document.getElementById('rateInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundBtn = document.getElementById('soundBtn');
        const elapsedTimeEl = document.getElementById('elapsedTime');
        const rateDisplay = document.getElementById('rateDisplay');
        const flipContainer = document.getElementById('flipContainer');

        // Create flip cards for display (5 digits + 1 dot)
        function initializeDisplay() {
            flipContainer.innerHTML = '';
            const digits = ['0', '0', '.', '0', '0'];
            
            digits.forEach((char, index) => {
                if (char === '.') {
                    const sep = document.createElement('span');
                    sep.className = 'separator';
                    sep.textContent = '.';
                    flipContainer.appendChild(sep);
                } else {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'digit-wrapper';
                    wrapper.innerHTML = `
                        <div class="flip-card" data-index="${index}">
                            <div class="flip-card-inner">
                                <div class="card-face card-top">
                                    <span>0</span>
                                </div>
                                <div class="card-face card-bottom">
                                    <span>0</span>
                                </div>
                                <div class="flip-card-back-top">
                                    <span>0</span>
                                </div>
                                <div class="flip-card-back-bottom">
                                    <span>0</span>
                                </div>
                            </div>
                        </div>
                    `;
                    flipContainer.appendChild(wrapper);
                }
            });
        }

        function playFlipSound() {
            if (!soundEnabled) return;
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function updateDigit(index, newValue) {
            const cards = document.querySelectorAll('.flip-card');
            let cardIndex = index;
            if (index >= 2) cardIndex = index - 1; // Adjust for separator
            
            const card = cards[cardIndex];
            if (!card) return;

            const currentTop = card.querySelector('.card-top span');
            const currentBottom = card.querySelector('.card-bottom span');
            const backTop = card.querySelector('.flip-card-back-top span');
            const backBottom = card.querySelector('.flip-card-back-bottom span');
            
            const currentValue = currentTop.textContent;
            
            if (currentValue === newValue) return;

            // Set the new value on back cards
            backTop.textContent = currentValue;
            backBottom.textContent = newValue;

            // Trigger flip animation
            card.classList.add('flipping');
            playFlipSound();

            // Wobble adjacent cards
            cards.forEach((c, i) => {
                if (i !== cardIndex) {
                    c.classList.add('wobble');
                    setTimeout(() => c.classList.remove('wobble'), 400);
                }
            });

            setTimeout(() => {
                currentTop.textContent = newValue;
                currentBottom.textContent = newValue;
                card.classList.remove('flipping');
            }, 800);
        }

        function updateDisplay(value) {
            const formatted = value.toFixed(2).padStart(5, '0');
            const newDisplay = formatted.slice(0, 2) + '.' + formatted.slice(2);
            
            for (let i = 0; i < newDisplay.length; i++) {
                if (newDisplay[i] !== '.' && currentDisplayValue[i] !== newDisplay[i]) {
                    updateDigit(i, newDisplay[i]);
                }
            }
            
            currentDisplayValue = newDisplay;
        }

        function updateTimer() {
            elapsedSeconds++;
            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;
            
            elapsedTimeEl.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            const costPerSecond = hourlyRate / 3600;
            const currentCost = costPerSecond * elapsedSeconds;
            updateDisplay(currentCost);
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                const rate = parseFloat(rateInput.value);
                if (isNaN(rate) || rate <= 0) {
                    alert('Please enter a valid hourly rate');
                    return;
                }
                
                hourlyRate = rate;
                isRunning = true;
                startTime = Date.now();
                rateDisplay.textContent = `$${hourlyRate.toFixed(2)} / hour`;
                
                intervalId = setInterval(updateTimer, 1000);
                
                startBtn.textContent = 'Pause';
                rateInput.disabled = true;
            } else {
                isRunning = false;
                clearInterval(intervalId);
                startBtn.textContent = 'Resume';
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(intervalId);
            elapsedSeconds = 0;
            elapsedTimeEl.textContent = '00:00:00';
            rateDisplay.textContent = '';
            startBtn.textContent = 'Start';
            rateInput.disabled = false;
            currentDisplayValue = '00.00';
            initializeDisplay();
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
        });

        // Initialize
        initializeDisplay();
    </script>
</body>
</html>
