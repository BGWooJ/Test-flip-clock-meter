<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Taxi Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        label {
            font-size: 18px;
            color: #999;
        }

        input[type="number"] {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 20px;
            font-size: 24px;
            border-radius: 8px;
            width: 200px;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #666;
        }

        .start-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #ddd;
            transform: scale(1.05);
        }

        .start-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: scale(1);
        }

        .meter-display {
            margin: 60px 0;
        }

        .cost-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .flip-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .flip-card {
            position: relative;
            width: 80px;
            height: 120px;
            perspective: 1000px;
        }

        .flip-card.separator {
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #333;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .flip-card-face {
            position: absolute;
            width: 100%;
            height: 50%;
            background: #1a1a1a;
            border: 2px solid #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flip-card-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
        }

        .flip-card-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            border-top: 1px solid #000;
        }

        .flip-card-number {
            font-size: 80px;
            font-weight: bold;
            color: #fff;
            line-height: 1;
            position: absolute;
            width: 100%;
        }

        .flip-card-top .flip-card-number {
            top: 10px;
        }

        .flip-card-bottom .flip-card-number {
            bottom: 10px;
        }

        .flip-card-flap {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 0;
            background: #1a1a1a;
            border: 2px solid #000;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
            transform-origin: bottom;
            transform-style: preserve-3d;
            overflow: hidden;
            z-index: 2;
        }

        .flip-card-flap .flip-card-number {
            font-size: 80px;
            font-weight: bold;
            color: #fff;
            line-height: 1;
            position: absolute;
            width: 100%;
            top: 10px;
        }

        @keyframes flip {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-180deg);
            }
        }

        .flip-card-flap.flipping {
            animation: flip 0.4s ease-in-out;
        }

        @keyframes wobble {
            0%, 100% {
                transform: rotateX(0deg);
            }
            25% {
                transform: rotateX(2deg);
            }
            75% {
                transform: rotateX(-2deg);
            }
        }

        .flip-card-inner.wobble {
            animation: wobble 0.4s ease-in-out;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 40px;
        }

        .control-btn {
            background: none;
            border: 2px solid #333;
            color: #666;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: #666;
            color: #999;
        }

        .elapsed-time {
            font-size: 14px;
            color: #666;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 600px) {
            .flip-card {
                width: 60px;
                height: 90px;
            }

            .flip-card-number {
                font-size: 60px !important;
            }

            .flip-card-top .flip-card-number {
                top: 8px !important;
            }

            .flip-card-bottom .flip-card-number {
                bottom: 8px !important;
            }

            .flip-card-flap .flip-card-number {
                font-size: 60px !important;
                top: 8px !important;
            }

            input[type="number"] {
                width: 150px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <div class="input-group">
                <label for="hourlyRate">Hourly Rate ($):</label>
                <input type="number" id="hourlyRate" value="150" min="0" step="0.01">
                <button class="start-btn" id="startBtn">START</button>
            </div>
        </div>

        <div class="meter-display">
            <div class="cost-label">CURRENT COST</div>
            <div class="flip-container" id="flipContainer">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="resetBtn" title="Reset">↻</button>
            <div class="elapsed-time" id="elapsedTime">00:00:00</div>
            <button class="control-btn" id="soundBtn" title="Toggle Sound">🔊</button>
        </div>
    </div>

    <script>
        let isRunning = false;
        let startTime = null;
        let elapsedSeconds = 0;
        let currentCost = 0;
        let intervalId = null;
        let soundEnabled = true;
        let hourlyRate = 150;

        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundBtn = document.getElementById('soundBtn');
        const hourlyRateInput = document.getElementById('hourlyRate');
        const flipContainer = document.getElementById('flipContainer');
        const elapsedTimeDisplay = document.getElementById('elapsedTime');

        // Audio context for tick sound
        let audioContext;
        
        function playTickSound() {
            if (!soundEnabled) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function initializeDisplay() {
            flipContainer.innerHTML = '';
            const display = '$00.00';
            
            for (let i = 0; i < display.length; i++) {
                const char = display[i];
                if (char === '$' || char === '.') {
                    const separator = document.createElement('div');
                    separator.className = 'flip-card separator';
                    separator.textContent = char;
                    flipContainer.appendChild(separator);
                } else {
                    const card = createFlipCard(char, i);
                    flipContainer.appendChild(card);
                }
            }
        }

        function createFlipCard(digit, index) {
            const card = document.createElement('div');
            card.className = 'flip-card';
            card.dataset.index = index;
            card.dataset.value = digit;
            
            const inner = document.createElement('div');
            inner.className = 'flip-card-inner';
            
            // Top half (current digit)
            const top = document.createElement('div');
            top.className = 'flip-card-face flip-card-top';
            const topNumber = document.createElement('div');
            topNumber.className = 'flip-card-number';
            topNumber.textContent = digit;
            top.appendChild(topNumber);
            
            // Bottom half (current digit)
            const bottom = document.createElement('div');
            bottom.className = 'flip-card-face flip-card-bottom';
            const bottomNumber = document.createElement('div');
            bottomNumber.className = 'flip-card-number';
            bottomNumber.textContent = digit;
            bottom.appendChild(bottomNumber);
            
            inner.appendChild(top);
            inner.appendChild(bottom);
            card.appendChild(inner);
            
            return card;
        }

        function updateDigit(card, newDigit) {
            const oldDigit = card.dataset.value;
            if (oldDigit === newDigit) return;
            
            card.dataset.value = newDigit;
            const inner = card.querySelector('.flip-card-inner');
            const top = card.querySelector('.flip-card-top .flip-card-number');
            const bottom = card.querySelector('.flip-card-bottom .flip-card-number');
            
            // Create flap for animation
            const flap = document.createElement('div');
            flap.className = 'flip-card-flap flipping';
            const flapNumber = document.createElement('div');
            flapNumber.className = 'flip-card-number';
            flapNumber.textContent = oldDigit;
            flap.appendChild(flapNumber);
            card.appendChild(flap);
            
            // Update bottom to show new digit immediately
            bottom.textContent = newDigit;
            
            playTickSound();
            
            // Remove flap after animation
            setTimeout(() => {
                flap.remove();
                top.textContent = newDigit;
            }, 400);
        }

        function wobbleCard(card) {
            const inner = card.querySelector('.flip-card-inner');
            inner.classList.add('wobble');
            setTimeout(() => {
                inner.classList.remove('wobble');
            }, 400);
        }

        function updateDisplay(cost) {
            const formattedCost = cost.toFixed(2);
            const display = `$${formattedCost.padStart(5, '0')}`;
            
            const cards = Array.from(flipContainer.children).filter(el => 
                el.classList.contains('flip-card') && !el.classList.contains('separator')
            );
            
            let displayIndex = 0;
            for (let i = 0; i < display.length; i++) {
                if (display[i] !== '$' && display[i] !== '.') {
                    if (displayIndex < cards.length) {
                        const card = cards[displayIndex];
                        const newDigit = display[i];
                        
                        if (card.dataset.value !== newDigit) {
                            updateDigit(card, newDigit);
                            
                            // Wobble adjacent cards
                            if (displayIndex > 0) {
                                wobbleCard(cards[displayIndex - 1]);
                            }
                            if (displayIndex < cards.length - 1) {
                                wobbleCard(cards[displayIndex + 1]);
                            }
                        }
                        displayIndex++;
                    }
                }
            }
        }

        function updateElapsedTime() {
            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;
            
            elapsedTimeDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function tick() {
            elapsedSeconds++;
            currentCost = (hourlyRate / 3600) * elapsedSeconds;
            updateDisplay(currentCost);
            updateElapsedTime();
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                hourlyRate = parseFloat(hourlyRateInput.value) || 0;
                if (hourlyRate <= 0) {
                    alert('Please enter a valid hourly rate');
                    return;
                }
                
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                startBtn.style.background = '#ff6b6b';
                hourlyRateInput.disabled = true;
                
                startTime = Date.now() - (elapsedSeconds * 1000);
                intervalId = setInterval(tick, 1000);
            } else {
                isRunning = false;
                startBtn.textContent = 'RESUME';
                startBtn.style.background = '#4ecdc4';
                clearInterval(intervalId);
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            elapsedSeconds = 0;
            currentCost = 0;
            startBtn.textContent = 'START';
            startBtn.style.background = '#fff';
            hourlyRateInput.disabled = false;
            clearInterval(intervalId);
            initializeDisplay();
            updateElapsedTime();
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
        });

        // Initialize
        initializeDisplay();
        updateElapsedTime();
    </script>
</body>
</html>
