<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Taxi Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #rateInput {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #ffffff;
            font-size: 48px;
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
            width: 250px;
            font-weight: bold;
        }

        #rateInput:focus {
            outline: none;
            border-color: #555;
        }

        .label {
            color: #888;
            font-size: 18px;
        }

        .display-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .counter-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dollar-sign {
            font-size: 80px;
            font-weight: bold;
            color: #00ff00;
            margin-right: 10px;
        }

        .digits-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .digit {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            width: 90px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            font-weight: bold;
            line-height: 140px;
            overflow: hidden;
            position: relative;
            perspective: 300px;
        }

        .digit-content {
            transform-style: preserve-3d;
            transition: transform 0.4s ease-in-out;
        }

        .digit.flip .digit-content {
            animation: flipAnimation 0.4s ease-in-out;
        }

        .digit.wobble {
            animation: wobbleAnimation 0.4s ease-in-out;
        }

        @keyframes flipAnimation {
            0% {
                transform: rotateX(0deg);
            }
            50% {
                transform: rotateX(90deg);
            }
            100% {
                transform: rotateX(0deg);
            }
        }

        @keyframes wobbleAnimation {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(2deg);
            }
            75% {
                transform: rotate(-2deg);
            }
        }

        .decimal {
            font-size: 80px;
            font-weight: bold;
            margin: 0 5px;
        }

        .rate-display {
            color: #888;
            font-size: 24px;
        }

        #startButton {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        #startButton:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        #startButton:active {
            transform: scale(0.95);
        }

        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .control-button {
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-radius: 50%;
            background: transparent;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.2s;
        }

        .control-button:hover {
            border-color: #666;
            transform: scale(1.1);
        }

        .timer-display {
            color: #888;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <input type="number" id="rateInput" placeholder="125" min="0" step="0.01">
            <div class="label">$ per hour</div>
        </div>

        <div class="display-section">
            <div class="counter-display">
                <div class="dollar-sign">$</div>
                <div class="digits-container">
                    <div class="digit" data-index="0"><div class="digit-content">0</div></div>
                    <div class="digit" data-index="1"><div class="digit-content">0</div></div>
                    <div class="digit" data-index="2"><div class="digit-content">0</div></div>
                    <div class="digit" data-index="3"><div class="digit-content">0</div></div>
                    <div class="decimal">.</div>
                    <div class="digit" data-index="4"><div class="digit-content">0</div></div>
                    <div class="digit" data-index="5"><div class="digit-content">0</div></div>
                </div>
            </div>
            <div class="rate-display" id="rateDisplay">$0.00 / hour</div>
        </div>

        <button id="startButton">Start</button>
    </div>

    <div class="bottom-controls">
        <button class="control-button" id="resetButton" title="Reset">↻</button>
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <button class="control-button" id="soundButton" title="Toggle Sound">🔇</button>
    </div>

    <script>
        const state = {
            isRunning: false,
            isPaused: false,
            hourlyRate: 0,
            totalSeconds: 0,
            accumulatedCost: 0,
            startTime: null,
            soundEnabled: false,
            intervalId: null,
            audioContext: null
        };

        const elements = {
            rateInput: document.getElementById('rateInput'),
            startButton: document.getElementById('startButton'),
            rateDisplay: document.getElementById('rateDisplay'),
            timerDisplay: document.getElementById('timerDisplay'),
            resetButton: document.getElementById('resetButton'),
            soundButton: document.getElementById('soundButton'),
            digits: document.querySelectorAll('.digit')
        };

        // Initialize Audio Context
        function initAudio() {
            if (!state.audioContext) {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play tick sound
        function playTick() {
            if (!state.soundEnabled || !state.audioContext) return;

            const oscillator = state.audioContext.createOscillator();
            const gainNode = state.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(state.audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.1, state.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.05);

            oscillator.start(state.audioContext.currentTime);
            oscillator.stop(state.audioContext.currentTime + 0.05);
        }

        // Update display
        function updateDisplay(cost) {
            const costString = cost.toFixed(2).padStart(7, '0');
            const digits = costString.replace('.', '').split('');

            digits.forEach((newDigit, index) => {
                const digitElement = elements.digits[index];
                const digitContent = digitElement.querySelector('.digit-content');
                const currentDigit = digitContent.textContent;

                if (currentDigit !== newDigit) {
                    // Trigger flip animation
                    digitElement.classList.add('flip');
                    digitContent.textContent = newDigit;

                    // Trigger wobble on adjacent digits
                    if (index > 0) {
                        elements.digits[index - 1].classList.add('wobble');
                    }
                    if (index < elements.digits.length - 1) {
                        elements.digits[index + 1].classList.add('wobble');
                    }

                    // Remove animation classes
                    setTimeout(() => {
                        digitElement.classList.remove('flip');
                        elements.digits.forEach(d => d.classList.remove('wobble'));
                    }, 400);
                }
            });
        }

        // Update timer display
        function updateTimer() {
            const hours = Math.floor(state.totalSeconds / 3600);
            const minutes = Math.floor((state.totalSeconds % 3600) / 60);
            const seconds = state.totalSeconds % 60;

            elements.timerDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Main counter function
        function tick() {
            state.totalSeconds++;
            state.accumulatedCost = (state.hourlyRate / 3600) * state.totalSeconds;
            updateDisplay(state.accumulatedCost);
            updateTimer();
            playTick();
        }

        // Start/Pause/Resume button
        elements.startButton.addEventListener('click', () => {
            initAudio();

            if (!state.isRunning) {
                // Start
                state.hourlyRate = parseFloat(elements.rateInput.value) || 0;
                elements.rateDisplay.textContent = `$${state.hourlyRate.toFixed(2)} / hour`;
                state.isRunning = true;
                state.isPaused = false;
                elements.startButton.textContent = 'Pause';
                elements.rateInput.disabled = true;

                state.intervalId = setInterval(tick, 1000);
            } else if (!state.isPaused) {
                // Pause
                clearInterval(state.intervalId);
                state.isPaused = true;
                elements.startButton.textContent = 'Resume';
            } else {
                // Resume
                state.isPaused = false;
                elements.startButton.textContent = 'Pause';
                state.intervalId = setInterval(tick, 1000);
            }
        });

        // Reset button
        elements.resetButton.addEventListener('click', () => {
            clearInterval(state.intervalId);
            state.isRunning = false;
            state.isPaused = false;
            state.totalSeconds = 0;
            state.accumulatedCost = 0;
            elements.startButton.textContent = 'Start';
            elements.rateInput.disabled = false;
            updateDisplay(0);
            updateTimer();
        });

        // Sound toggle
        elements.soundButton.addEventListener('click', () => {
            initAudio();
            state.soundEnabled = !state.soundEnabled;
            elements.soundButton.textContent = state.soundEnabled ? '🔊' : '🔇';
        });

        // Update rate display on input
        elements.rateInput.addEventListener('input', (e) => {
            const rate = parseFloat(e.target.value) || 0;
            elements.rateDisplay.textContent = `$${rate.toFixed(2)} / hour`;
        });

        // Initialize display
        updateDisplay(0);
        updateTimer();
    </script>
</body>
</html>
