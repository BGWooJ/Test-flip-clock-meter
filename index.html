<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Taxi Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .input-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .rate-input {
            font-size: 48px;
            padding: 20px;
            width: 300px;
            text-align: center;
            border: 2px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            color: #fff;
            margin-bottom: 10px;
        }

        .rate-label {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .start-btn {
            font-size: 24px;
            padding: 15px 60px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .meter-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .dollar-sign {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
        }

        .digits-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .flip-card {
            position: relative;
            width: 80px;
            height: 120px;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipping .flip-card-inner {
            animation: flip 0.6s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0deg); }
        }

        .digit-display {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            backface-visibility: hidden;
        }

        .decimal {
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            margin: 0 5px;
        }

        .rate-display {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #333;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .control-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .time-display {
            font-size: 24px;
            color: #666;
            font-family: 'Courier New', monospace;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="input-section" id="inputSection">
        <input type="number" class="rate-input" id="rateInput" value="125" min="0" step="0.01">
        <div class="rate-label">$ per hour</div>
        <button class="start-btn" id="startBtn">Start</button>
    </div>

    <div class="input-section hidden" id="resumeSection">
        <button class="start-btn" id="resumeBtn">Resume</button>
    </div>

    <div class="meter-display">
        <div class="dollar-sign">$</div>
        <div class="digits-container" id="digitsContainer"></div>
    </div>

    <div class="rate-display" id="rateDisplay">$0.00 / hour</div>

    <div class="controls">
        <button class="control-btn" id="resetBtn" title="Reset">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 21v-5h5"/>
            </svg>
        </button>
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <button class="control-btn" id="soundBtn" title="Sound On/Off">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="soundIcon">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" id="soundWave"></path>
            </svg>
        </button>
    </div>

    <script>
        let hourlyRate = 0;
        let totalSeconds = 0;
        let isRunning = false;
        let intervalId = null;
        let soundEnabled = true;
        let currentAmount = 0;
        let digitElements = [];

        const rateInput = document.getElementById('rateInput');
        const startBtn = document.getElementById('startBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundBtn = document.getElementById('soundBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const rateDisplay = document.getElementById('rateDisplay');
        const digitsContainer = document.getElementById('digitsContainer');
        const inputSection = document.getElementById('inputSection');
        const resumeSection = document.getElementById('resumeSection');
        const soundWave = document.getElementById('soundWave');

        function initializeDigits() {
            digitsContainer.innerHTML = '';
            digitElements = [];
            
            // Create 7 digits before decimal (for up to $9,999,999)
            for (let i = 0; i < 7; i++) {
                const card = createFlipCard();
                digitsContainer.appendChild(card);
                digitElements.push(card);
            }
            
            // Add decimal point
            const decimal = document.createElement('div');
            decimal.className = 'decimal';
            decimal.textContent = '.';
            digitsContainer.appendChild(decimal);
            
            // Create 2 digits after decimal
            for (let i = 0; i < 2; i++) {
                const card = createFlipCard();
                digitsContainer.appendChild(card);
                digitElements.push(card);
            }
        }

        function createFlipCard() {
            const card = document.createElement('div');
            card.className = 'flip-card';
            
            const inner = document.createElement('div');
            inner.className = 'flip-card-inner';
            
            const display = document.createElement('div');
            display.className = 'digit-display';
            display.textContent = '0';
            
            inner.appendChild(display);
            card.appendChild(inner);
            
            return card;
        }

        function updateDisplay(amount) {
            // Format to 9 total digits (7 before decimal, 2 after)
            const formattedAmount = amount.toFixed(2).padStart(10, '0').replace('.', '');
            
            for (let i = 0; i < digitElements.length; i++) {
                const card = digitElements[i];
                const display = card.querySelector('.digit-display');
                const newDigit = formattedAmount[i];
                
                if (display.textContent !== newDigit) {
                    // Trigger flip animation
                    card.classList.add('flipping');
                    
                    setTimeout(() => {
                        display.textContent = newDigit;
                    }, 300);
                    
                    setTimeout(() => {
                        card.classList.remove('flipping');
                    }, 600);
                    
                    if (soundEnabled) {
                        playTickSound();
                    }
                }
            }
        }

        function playTickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function updateTimer() {
            totalSeconds++;
            
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            timeDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            // Calculate cost: (rate per hour / 3600 seconds) * total seconds
            currentAmount = (hourlyRate / 3600) * totalSeconds;
            updateDisplay(currentAmount);
        }

        function start() {
            hourlyRate = parseFloat(rateInput.value) || 0;
            
            if (hourlyRate <= 0) {
                alert('Please enter a valid hourly rate');
                return;
            }
            
            isRunning = true;
            inputSection.classList.add('hidden');
            resumeSection.classList.add('hidden');
            rateDisplay.textContent = `$${hourlyRate.toFixed(2)} / hour`;
            
            intervalId = setInterval(updateTimer, 1000);
        }

        function pause() {
            isRunning = false;
            clearInterval(intervalId);
            resumeSection.classList.remove('hidden');
        }

        function resume() {
            isRunning = true;
            resumeSection.classList.add('hidden');
            intervalId = setInterval(updateTimer, 1000);
        }

        function reset() {
            isRunning = false;
            clearInterval(intervalId);
            totalSeconds = 0;
            currentAmount = 0;
            timeDisplay.textContent = '00:00:00';
            updateDisplay(0);
            inputSection.classList.remove('hidden');
            resumeSection.classList.add('hidden');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundWave.style.display = 'block';
                soundBtn.style.color = '#666';
            } else {
                soundWave.style.display = 'none';
                soundBtn.style.color = '#333';
            }
        }

        startBtn.addEventListener('click', start);
        resumeBtn.addEventListener('click', resume);
        resetBtn.addEventListener('click', reset);
        soundBtn.addEventListener('click', toggleSound);

        // Pause on clicking the meter display
        document.querySelector('.meter-display').addEventListener('click', () => {
            if (isRunning) {
                pause();
            }
        });

        // Initialize
        initializeDigits();
        updateDisplay(0);
    </script>
</body>
</html>
