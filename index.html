<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Taxi Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 18px;
            letter-spacing: 1px;
        }

        input[type="number"] {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 20px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            width: 150px;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #666;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: #ddd;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .meter-display {
            margin: 60px 0;
        }

        .dollar-sign {
            font-size: 60px;
            display: inline-block;
            vertical-align: top;
            margin-right: 10px;
            margin-top: 20px;
        }

        .flip-container {
            display: inline-flex;
            gap: 8px;
        }

        .digit-wrapper {
            position: relative;
            perspective: 1000px;
        }

        .flip-digit {
            width: 80px;
            height: 120px;
            position: relative;
            display: inline-block;
        }

        .digit-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: bold;
            backface-visibility: hidden;
        }

        .digit-top, .digit-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: #1a1a1a;
            border: 2px solid #333;
        }

        .digit-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
        }

        .digit-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            border-top: 1px solid #000;
        }

        .digit-content {
            position: absolute;
            width: 100%;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
        }

        .digit-top .digit-content {
            top: 0;
            line-height: 120px;
        }

        .digit-bottom .digit-content {
            bottom: 0;
            line-height: 0;
        }

        .flip-top, .flip-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            overflow: hidden;
            transform-origin: bottom;
            z-index: 2;
        }

        .flip-top {
            top: 0;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #000;
            transform-origin: bottom;
        }

        .flip-bottom {
            bottom: 0;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 0 0 8px 8px;
            border-top: 1px solid #000;
            transform-origin: top;
        }

        .flip-top .digit-content {
            top: 0;
            line-height: 120px;
        }

        .flip-bottom .digit-content {
            bottom: 0;
            line-height: 0;
        }

        @keyframes flipDown {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-180deg);
            }
        }

        @keyframes flipUp {
            0% {
                transform: rotateX(180deg);
            }
            100% {
                transform: rotateX(0deg);
            }
        }

        @keyframes wobble {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(0.5deg);
            }
            75% {
                transform: rotate(-0.5deg);
            }
        }

        .flipping .flip-top {
            animation: flipDown 0.4s ease-in-out;
        }

        .flipping .flip-bottom {
            animation: flipUp 0.4s ease-in-out;
        }

        .wobbling {
            animation: wobble 0.4s ease-in-out;
        }

        .decimal-point {
            font-size: 72px;
            display: inline-block;
            margin: 0 5px;
            line-height: 120px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .icon-btn {
            background: transparent;
            border: 2px solid #333;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            border-color: #666;
            background: #1a1a1a;
        }

        .elapsed-time {
            font-size: 24px;
            letter-spacing: 2px;
            color: #666;
        }

        .sound-indicator {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .flip-digit {
                width: 50px;
                height: 80px;
            }

            .digit-content {
                font-size: 48px !important;
            }

            .digit-top .digit-content {
                line-height: 80px !important;
            }

            .dollar-sign {
                font-size: 40px;
                margin-top: 10px;
            }

            .decimal-point {
                font-size: 48px;
                line-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <div class="input-group">
                <div class="input-wrapper">
                    <label for="hourlyRate">$/hour:</label>
                    <input type="number" id="hourlyRate" value="150" min="0" step="0.01">
                </div>
                <button class="btn" id="startBtn">START</button>
            </div>
        </div>

        <div class="meter-display">
            <span class="dollar-sign">$</span>
            <div class="flip-container" id="flipDisplay"></div>
        </div>

        <div class="controls">
            <button class="icon-btn" id="resetBtn" title="Reset">↻</button>
            <div class="elapsed-time" id="elapsedTime">00:00:00</div>
            <button class="icon-btn" id="soundBtn" title="Toggle Sound">
                <span id="soundIcon">🔊</span>
            </button>
        </div>
    </div>

    <script>
        let isRunning = false;
        let startTime = null;
        let elapsedSeconds = 0;
        let intervalId = null;
        let hourlyRate = 150;
        let soundEnabled = true;
        let previousDigits = ['0', '0', '0', '0', '0', '0'];

        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const hourlyRateInput = document.getElementById('hourlyRate');
        const flipDisplay = document.getElementById('flipDisplay');
        const elapsedTimeDisplay = document.getElementById('elapsedTime');

        // Audio context for tick sound
        let audioContext;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            if (!soundEnabled || !audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function initializeDisplay() {
            flipDisplay.innerHTML = '';
            const digits = ['0', '0', '0', '0', '0', '0'];
            
            for (let i = 0; i < 6; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'digit-wrapper';
                
                const flipDigit = document.createElement('div');
                flipDigit.className = 'flip-digit';
                flipDigit.id = `digit-${i}`;
                
                flipDigit.innerHTML = `
                    <div class="digit-top">
                        <div class="digit-content">${digits[i]}</div>
                    </div>
                    <div class="digit-bottom">
                        <div class="digit-content">${digits[i]}</div>
                    </div>
                `;
                
                wrapper.appendChild(flipDigit);
                flipDisplay.appendChild(wrapper);
                
                if (i === 3) {
                    const decimal = document.createElement('span');
                    decimal.className = 'decimal-point';
                    decimal.textContent = '.';
                    flipDisplay.appendChild(decimal);
                }
            }
        }

        function flipDigit(index, newDigit) {
            const digitElement = document.getElementById(`digit-${index}`);
            const oldDigit = previousDigits[index];
            
            if (oldDigit === newDigit) return;
            
            digitElement.classList.add('flipping');
            
            // Create flip animation elements
            const flipTop = document.createElement('div');
            flipTop.className = 'flip-top';
            flipTop.innerHTML = `<div class="digit-content">${oldDigit}</div>`;
            
            const flipBottom = document.createElement('div');
            flipBottom.className = 'flip-bottom';
            flipBottom.innerHTML = `<div class="digit-content">${newDigit}</div>`;
            
            digitElement.appendChild(flipTop);
            digitElement.appendChild(flipBottom);
            
            playTickSound();
            
            setTimeout(() => {
                digitElement.querySelector('.digit-top .digit-content').textContent = newDigit;
                digitElement.querySelector('.digit-bottom .digit-content').textContent = newDigit;
                digitElement.classList.remove('flipping');
                flipTop.remove();
                flipBottom.remove();
                previousDigits[index] = newDigit;
            }, 400);
            
            // Wobble adjacent digits
            if (index > 0) {
                const prevDigit = document.getElementById(`digit-${index - 1}`);
                prevDigit.classList.add('wobbling');
                setTimeout(() => prevDigit.classList.remove('wobbling'), 400);
            }
            if (index < 5) {
                const nextDigit = document.getElementById(`digit-${index + 1}`);
                nextDigit.classList.add('wobbling');
                setTimeout(() => nextDigit.classList.remove('wobbling'), 400);
            }
        }

        function updateDisplay(amount) {
            const formatted = amount.toFixed(2).padStart(6, '0');
            const digitsArray = formatted.replace('.', '').split('');
            
            digitsArray.forEach((digit, index) => {
                flipDigit(index, digit);
            });
        }

        function updateElapsedTime() {
            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;
            
            elapsedTimeDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function tick() {
            elapsedSeconds++;
            const costPerSecond = hourlyRate / 3600;
            const currentCost = elapsedSeconds * costPerSecond;
            
            updateDisplay(currentCost);
            updateElapsedTime();
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                initAudio();
                hourlyRate = parseFloat(hourlyRateInput.value) || 150;
                hourlyRateInput.disabled = true;
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                startBtn.style.background = '#ff6b6b';
                
                intervalId = setInterval(tick, 1000);
            } else {
                isRunning = false;
                startBtn.textContent = 'RESUME';
                startBtn.style.background = '#fff';
                clearInterval(intervalId);
                hourlyRateInput.disabled = false;
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            elapsedSeconds = 0;
            startBtn.textContent = 'START';
            startBtn.style.background = '#fff';
            clearInterval(intervalId);
            hourlyRateInput.disabled = false;
            
            previousDigits = ['0', '0', '0', '0', '0', '0'];
            initializeDisplay();
            updateElapsedTime();
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
        });

        // Initialize
        initializeDisplay();
        updateElapsedTime();
    </script>
</body>
</html>
